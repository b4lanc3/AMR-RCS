name: Build RCS binaries

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Qt dependencies
        if: matrix.os == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 \
            libnss3

      - name: Install dependencies
        working-directory: RCS
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller websockets

      - name: Smoke test (headless import + MainWindow)
        working-directory: RCS
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          python -c "import sys; from PySide6.QtWidgets import QApplication; from PySide6.QtCore import QTimer; app=QApplication(sys.argv); from rcs.ui import theme; theme.apply(app); from rcs.ui.main_window import MainWindow; w=MainWindow(); w.show(); QTimer.singleShot(500, app.quit); sys.exit(app.exec())"

      - name: End-to-end test against mock rosbridge
        working-directory: RCS
        env:
          QT_QPA_PLATFORM: offscreen
        run: python tests/test_e2e.py

      - name: Build with PyInstaller
        working-directory: RCS
        run: python build.py

      - name: Verify Linux build launches
        if: matrix.os == 'ubuntu-22.04'
        working-directory: RCS
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          ./dist/rcs/rcs &
          PID=$!
          sleep 4
          if kill -0 $PID; then
            echo "ALIVE"
            kill $PID
            wait $PID 2>/dev/null || true
          else
            echo "DIED"; exit 1
          fi

      - name: Verify Windows build launches
        if: matrix.os == 'windows-latest'
        working-directory: RCS
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\rcs\rcs.exe" -PassThru
          Start-Sleep -Seconds 5
          if (-not $p.HasExited) {
            Write-Host "ALIVE"
            Stop-Process -Id $p.Id -Force
          } else {
            Write-Host "DIED"
            exit 1
          }

      - name: Package Linux tarball
        if: matrix.os == 'ubuntu-22.04'
        working-directory: RCS
        run: |
          cp dist/README.txt dist/README.txt 2>/dev/null || true
          cd dist && tar czf rcs-linux-x86_64.tar.gz rcs

      - name: Package Windows zip
        if: matrix.os == 'windows-latest'
        working-directory: RCS
        shell: pwsh
        run: |
          Compress-Archive -Path dist/rcs/* -DestinationPath dist/rcs-windows-x86_64.zip

      - name: Upload Linux artifact
        if: matrix.os == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: rcs-linux-x86_64
          path: RCS/dist/rcs-linux-x86_64.tar.gz

      - name: Upload Windows artifact
        if: matrix.os == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: rcs-windows-x86_64
          path: RCS/dist/rcs-windows-x86_64.zip
