[project]
name = "rcs"
version = "0.4.0"
description = "Robot Control System — desktop operator console for Hinson AMRs"
requires-python = ">=3.9"
dependencies = [
    "PySide6==6.8.3",
    "roslibpy>=1.6",
    "numpy>=1.24",
    "Pillow>=10.0",
    "pyqtgraph>=0.13",
    "PyOpenGL>=3.1",
]

[project.scripts]
rcs = "rcs.app:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["rcs*"]
