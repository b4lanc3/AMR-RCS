name: Build and test RCS

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUNBUFFERED: "1"
      PYTHONUTF8: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libegl1 libxkbcommon0 libdbus-1-3 \
            libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 \
            libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-sync1 \
            libxcb-xfixes0 libxcb-xinerama0 libxcb-xkb1 libxkbcommon-x11-0 libnss3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller websockets

      - name: Feature tests
        run: python tests/test_features.py

      - name: End-to-end test (source) against mock rosbridge
        run: python tests/test_e2e.py

      - name: Build (console)
        run: python build.py

      - name: End-to-end test (built binary) against mock rosbridge
        run: python tests/test_built_binary_e2e.py

      - name: Package Linux build
        if: runner.os == 'Linux'
        run: tar czf rcs-linux-x86_64.tar.gz -C dist rcs

      - name: Package Windows console build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/rcs -DestinationPath rcs-windows-x86_64-console.zip

      - name: Build (windowed, no console)
        if: runner.os == 'Windows'
        env:
          RCS_WINDOWED: "1"
        run: python build.py

      - name: End-to-end test (windowed build) against mock rosbridge
        if: runner.os == 'Windows'
        run: python tests/test_built_binary_e2e.py

      - name: Package Windows windowed build
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path dist/rcs -DestinationPath rcs-windows-x86_64.zip

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: rcs-linux-x86_64
          path: rcs-linux-x86_64.tar.gz

      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: rcs-windows-x86_64
          path: |
            rcs-windows-x86_64.zip
            rcs-windows-x86_64-console.zip

  # On a version tag, publish the tested builds as a GitHub Release.
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true
      - name: Create or update the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la artifacts
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" artifacts/* --clobber
            gh release edit "$GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          else
            gh release create "$GITHUB_REF_NAME" artifacts/* \
              --title "RCS $GITHUB_REF_NAME" --notes-file RELEASE_NOTES.md
          fi
